# Padrões de Categorização do Sistema Finance
# Este arquivo define regras para categorização automática de transações

version: "1.0"

# ============================================================================
# PADRÕES DE RENDA
# ============================================================================
income_patterns:
  salario:
    patterns:
      - pattern: "GABRIEL\\s+042"
        match_type: "regex"
        priority: 100
        description: "PIX da empresa RCConsultech"
      - pattern: "40952242000108"
        match_type: "contains"
        priority: 100
        description: "CNPJ da empresa"

  freelance:
    patterns:
      - pattern: "PPN TECNOLOGIA"
        match_type: "contains"
        priority: 90

  # Padrões para NÃO considerar como renda
  not_income:
    patterns:
      - pattern: "ESTORNO"
        match_type: "contains"
      - pattern: "DEVOLUCAO"
        match_type: "contains"
      - pattern: "CANCELAMENTO"
        match_type: "contains"
      - pattern: "GABRIEL LUCENA RAMOS"
        match_type: "contains"
        description: "Transferência própria para BTG"

# ============================================================================
# PADRÕES DE TRANSFERÊNCIA INTERNA (IGNORAR)
# ============================================================================
internal_transfer_patterns:
  patterns:
    - pattern: "PAGTO CARTAO CREDITO"
      match_type: "contains"
      priority: 100
    - pattern: "PGTO DEBITO CONTA"
      match_type: "contains"
      priority: 100
    - pattern: "PIX OPEN FINANCE"
      match_type: "contains"
      priority: 100
      description: "Transferência para BTG"
    - pattern: "GABRIEL LUCENA RAMOS"
      match_type: "contains"
      priority: 90
      description: "Transferência entre contas próprias"
    - pattern: "SALDO ANTERIOR"
