# ============================================================================
# CONFIGURAÇÕES DE DETECÇÃO DE PARCELAS
# ============================================================================
installment_patterns:
  regex_patterns:
    - "PARC\\s+(\\d{2})/(\\d{2})"     # PARC 04/12
    - "PARCELA\\s+(\\d+)\\s+DE\\s+(\\d+)"  # Parcela 4 de 12
    - "(\\d+)/(\\d+)X"                # 4/12X

# ============================================================================
# CONFIGURAÇÕES DE DETECÇÃO DE ASSINATURAS
# ============================================================================
subscription_detection:
  min_occurrences: 2        # Mínimo de vezes que deve aparecer
  months_to_analyze: 3      # Quantos meses analisar
  value_tolerance: 0.10     # Tolerância de 10% na variação de valor

  # Valores típicos de assinaturas (para ajudar na detecção)
  typical_ranges:
    streaming:
      min: 15
      max: 100
    musica:
      min: 10
      max: 50
    produtividade:
      min: 30
      max: 700  # Claude Max é ~R$600
